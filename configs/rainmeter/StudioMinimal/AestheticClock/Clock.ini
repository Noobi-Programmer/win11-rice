[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=StudioMinimal

[Metadata]
Name=StudioMinimal Aesthetic Clock
Author=win11-rice
Version=1.0.0
License=MIT
Information=Minimalist day, date, and time desktop widget.

[Variables]
FontMain=Segoe UI Light
FontMono=JetBrainsMono NFP
TextColor=205,214,244,235
AccentColor=180,190,254,230
MutedColor=166,173,200,190
ShadowColor=17,17,27,150

[MeasureTime]
Measure=Time
Format=%I:%M

[MeasureAmPm]
Measure=Time
Format=%p

[MeasureDay]
Measure=Time
Format=%A

[MeasureDate]
Measure=Time
Format=%d %B %Y

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=0
Y=0
FontFace=#FontMain#
FontSize=54
FontColor=#TextColor#
StringEffect=Shadow
FontEffectColor=#ShadowColor#
AntiAlias=1
Text="%1"

[MeterAmPm]
Meter=String
MeasureName=MeasureAmPm
X=4R
Y=44
FontFace=#FontMono#
FontSize=13
FontWeight=600
FontColor=#AccentColor#
StringEffect=Shadow
FontEffectColor=#ShadowColor#
AntiAlias=1
Text="%1"

[MeterDay]
Meter=String
MeasureName=MeasureDay
X=4
Y=74
FontFace=#FontMono#
FontSize=11
FontWeight=600
FontColor=#AccentColor#
StringEffect=Shadow
FontEffectColor=#ShadowColor#
AntiAlias=1
StringCase=Upper
Text="%1"

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=10R
Y=74
FontFace=#FontMono#
FontSize=11
FontColor=#MutedColor#
StringEffect=Shadow
FontEffectColor=#ShadowColor#
AntiAlias=1
Text="•  %1"
