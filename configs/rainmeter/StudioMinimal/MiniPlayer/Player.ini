[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=StudioMinimal

[Metadata]
Name=StudioMinimal Mini Player
Author=win11-rice
Version=1.0.0
License=MIT
Information=Compact translucent dark pill media widget (280x68).

[Variables]
Width=280
Height=68
FontMono=JetBrainsMono NFP
BgColor=17,17,27,215
BorderColor=255,255,255,28
TextColor=205,214,244,240
SubColor=166,173,200,200
AccentColor=180,190,254,255
TrackBg=49,50,68,200

[MeasureTitle]
Measure=Plugin
Plugin=NowPlaying
PlayerName=Spotify
PlayerType=TITLE
Substitute="":"Nothing Playing"

[MeasureArtist]
Measure=Plugin
Plugin=NowPlaying
PlayerName=[MeasureTitle]
PlayerType=ARTIST
Substitute="":"Ready for playback"

[MeasureProgress]
Measure=Plugin
Plugin=NowPlaying
PlayerName=[MeasureTitle]
PlayerType=PROGRESS

[MeasureState]
Measure=Plugin
Plugin=NowPlaying
PlayerName=[MeasureTitle]
PlayerType=STATE
Substitute="0":"󰐊","1":"󰏤","2":"󰐊"

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#Width#,#Height#,12,12 | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#

[MeterTitle]
Meter=String
MeasureName=MeasureTitle
X=14
Y=11
W=172
H=18
ClipString=1
FontFace=#FontMono#
FontSize=10
FontWeight=600
FontColor=#TextColor#
AntiAlias=1
Text="%1"

[MeterArtist]
Meter=String
MeasureName=MeasureArtist
X=14
Y=29
W=172
H=16
ClipString=1
FontFace=#FontMono#
FontSize=8.5
FontColor=#SubColor#
AntiAlias=1
Text="%1"

[MeterPrev]
Meter=String
X=198
Y=16
FontFace=#FontMono#
FontSize=13
FontColor=#SubColor#
AntiAlias=1
Text="󰒮"
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Previous"]
MouseOverAction=[!SetOption MeterPrev FontColor "#AccentColor#"][!UpdateMeter MeterPrev][!Redraw]
MouseLeaveAction=[!SetOption MeterPrev FontColor "#SubColor#"][!UpdateMeter MeterPrev][!Redraw]

[MeterPlayPause]
Meter=String
MeasureName=MeasureState
X=224
Y=15
FontFace=#FontMono#
FontSize=15
FontColor=#AccentColor#
AntiAlias=1
Text="%1"
LeftMouseUpAction=[!CommandMeasure MeasureTitle "PlayPause"]

[MeterNext]
Meter=String
X=252
Y=16
FontFace=#FontMono#
FontSize=13
FontColor=#SubColor#
AntiAlias=1
Text="󰒭"
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Next"]
MouseOverAction=[!SetOption MeterNext FontColor "#AccentColor#"][!UpdateMeter MeterNext][!Redraw]
MouseLeaveAction=[!SetOption MeterNext FontColor "#SubColor#"][!UpdateMeter MeterNext][!Redraw]

[MeterProgressBg]
Meter=Shape
Shape=Rectangle 14,54,252,3,1.5,1.5 | Fill Color #TrackBg# | StrokeWidth 0

[MeterProgressBar]
Meter=Bar
MeasureName=MeasureProgress
X=14
Y=54
W=252
H=3
BarOrientation=Horizontal
BarColor=#AccentColor#
SolidColor=0,0,0,0
