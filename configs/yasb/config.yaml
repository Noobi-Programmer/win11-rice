# Shibumi Minimal - Studio-Grade YASB Reborn 2.x Top Bar
watch_stylesheet: true
watch_config: true
debug: false
update_check: false
show_systray: false

tooltip:
  offset: 6
  blur_effect:
    enabled: true
    dark_mode: true
    round_corners: true
    round_corners_type: "small"
    border_color: "None"

glazewm:
  start_command: "C:\\Users\\abini\\Apps\\GlazeWM\\PFiles64\\glzr.io\\GlazeWM\\cli\\glazewm.exe start"
  stop_command: "C:\\Users\\abini\\Apps\\GlazeWM\\PFiles64\\glzr.io\\GlazeWM\\cli\\glazewm.exe command wm-exit"
  reload_command: "C:\\Users\\abini\\Apps\\GlazeWM\\PFiles64\\glzr.io\\GlazeWM\\cli\\glazewm.exe command wm-exit && C:\\Users\\abini\\Apps\\GlazeWM\\PFiles64\\glzr.io\\GlazeWM\\cli\\glazewm.exe start"

bars:
  status-bar:
    enabled: true
    screens: ['*']
    class_name: "yasb-bar"
    context_menu: true
    alignment:
      position: "top"
      align: "center"
    dimensions:
      width: "100%"
      height: 30
    padding:
      top: 6
      left: 10
      bottom: 0
      right: 10
    animation:
      enabled: true
      duration: 180
      type: "fade"
    blur_effect:
      enabled: true
      dark_mode: true
      round_corners: true
      round_corners_type: "normal"
      border_color: "None"
    window_flags:
      always_on_top: true
      windows_app_bar: true
      hide_on_fullscreen: false
      auto_hide: false
    layouts:
      left:
        alignment: "left"
        stretch: true
      center:
        alignment: "center"
        stretch: true
      right:
        alignment: "right"
        stretch: true
    widgets:
      left: ["glazewm_workspaces", "media"]
      center: ["clock"]
      right: ["mode_btn", "cpu", "memory", "volume", "wifi", "battery"]

widgets:
  glazewm_workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      offline_label: "WM Off"
      hide_if_offline: true
      monitor_exclusive: true
      enable_scroll_switching: true
      empty_label: "{name}"
      populated_label: "{name}"
      active_empty_label: "{name}"
      active_populated_label: "{name}"
      focused_empty_label: "{name}"
      focused_populated_label: "{name}"

  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "{title}"
      label_alt: "{artist} - {title}"
      max_field_size:
        label: 26
        label_alt: 32
      show_thumbnail: false
      controls_only: false
      controls_left: false
      hide_empty: true
      thumbnail_alpha: 80
      thumbnail_padding: 0
      thumbnail_corner_radius: 6
      icons:
        prev_track: "\udb81\udcae"
        next_track: "\udb81\udcad"
        play: "\udb81\udc0a"
        pause: "\udb80\udfe4"
      callbacks:
        on_left: "toggle_play_pause"
        on_middle: "do_nothing"
        on_right: "toggle_label"

  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%a, %d %b  \u2022  %I:%M %p}"
      label_alt: "{%A, %d %B %Y  \u2022  %H:%M}"
      locale: ""
      update_interval: 1000
      calendar:
        blur: true
        round_corners: true
        round_corners_type: "small"
        border_color: "None"
        alignment: "center"
        direction: "down"
        offset_top: 8
        show_week_numbers: false
        show_years: false
        extended: false
      callbacks:
        on_left: "toggle_calendar"
        on_middle: "do_nothing"
        on_right: "toggle_label"

  mode_btn:
    type: "yasb.custom.CustomWidget"
    options:
      label: "<span>\uf303</span> {data}"
      label_alt: "<span>\uf303</span> {data}"
      label_placeholder: "LINUX"
      class_name: "mode-btn-widget"
      tooltip: true
      tooltip_label: "Left-click: cycle mode | Right-click: toggle saver"
      exec_options:
        run_cmd: "powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:/Scripts/Get-Mode.ps1"
        run_interval: 2500
        run_once: false
        return_format: "string"
        hide_empty: false
        use_shell: true
      callbacks:
        on_left: "exec powershell.exe -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File C:/Scripts/Cycle-Mode.ps1"
        on_middle: "do_nothing"
        on_right: "exec powershell.exe -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File C:/Scripts/Switch-Mode.ps1 -Mode saver"

  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span>\udb80\udf5b</span> {info[percent][total]}%"
      label_alt: "<span>\udb80\udf5b</span> {info[freq][current]} MHz"
      update_interval: 2500
      hide_decimal: true
      cpu_thresholds:
        low: 25
        medium: 60
        high: 85
      callbacks:
        on_left: "toggle_label"
        on_right: "toggle_menu"
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: false
        graph_history_size: 60

  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span>\udb80\udf5d</span> {virtual_mem_percent}%"
      label_alt: "<span>\udb80\udf5d</span> {virtual_mem_free}/{virtual_mem_total}"
      update_interval: 4000
      hide_decimal: true
      memory_thresholds:
        low: 30
        medium: 65
        high: 88
      callbacks:
        on_left: "toggle_label"
        on_right: "toggle_menu"
      menu:
        enabled: true
        show_graph: true

  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span> {level}"
      label_alt: "<span>{icon}</span> {level}"
      scroll_step: 2
      volume_icons:
        - "\udb81\udf5f"
        - "\udb81\udd7f"
        - "\udb81\udd80"
        - "\udb81\udd7e"
      callbacks:
        on_left: "toggle_volume_menu"
        on_middle: "toggle_mute"
        on_right: "toggle_mute"

  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      label: "<span>{wifi_icon}</span>"
      label_alt: "<span>{wifi_icon}</span> {wifi_name}"
      update_interval: 5000
      get_exact_wifi_strength: false
      wifi_icons:
        - "\udb82\udd2e"
        - "\udb82\udd1f"
        - "\udb82\udd22"
        - "\udb82\udd25"
        - "\udb82\udd28"
      callbacks:
        on_left: "toggle_label"
        on_right: "do_nothing"

  battery:
    type: "yasb.battery.BatteryWidget"
    options:
      label: "<span>{icon}</span> {percent}%"
      label_alt: "<span>{icon}</span> {time_remaining}"
      update_interval: 5000
      hide_unsupported: true
      time_remaining_natural: true
      status_thresholds:
        critical: 15
        low: 30
        medium: 65
        high: 90
        full: 100
      status_icons:
        icon_charging: "\udb80\udc84"
        icon_critical: "\udb80\udc7a"
        icon_low: "\udb80\udc7c"
        icon_medium: "\udb80\udc7f"
        icon_high: "\udb80\udc82"
        icon_full: "\udb80\udc79"
      callbacks:
        on_left: "toggle_label"
        on_right: "do_nothing"
