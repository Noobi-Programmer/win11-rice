# Minimal Linux-style GlazeWM 3.x configuration
# Top bar is YASB (or Windhawk hover dock in hybrid/studio); zebar is not started.
general:
  startup_commands: []
  shutdown_commands: []
  config_reload_commands: []
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'
  hide_method: 'cloak'
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  inner_gap: '6px'
  outer_gap:
    top: '6px'
    right: '6px'
    bottom: '6px'
    left: '6px'

window_effects:
  focused_window:
    border:
      enabled: true
      color: '#b4befe'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: 'square'
  other_windows:
    border:
      enabled: true
      color: '#313244'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: 'square'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: true
      shown_on_top: false

workspaces:
  - name: '1'
  - name: '2'
  - name: '3'
  - name: '4'
  - name: '5'
  - name: '6'
  - name: '7'
  - name: '8'
  - name: '9'

window_rules:
  # Keep YASB and Rainmeter desktop widgets out of tiling.
  - commands: ['ignore']
    match:
      - window_process: { equals: 'yasb' }
      - window_process: { equals: 'Rainmeter' }
  # Dialogs and tools that should always float.
  - commands: ['set-floating']
    match:
      - window_process: { equals: 'Taskmgr' }
      - window_process: { regex: 'LenovoLegionToolkit|Lenovo Legion Toolkit' }
      - window_process: { regex: 'Flow\.Launcher|FlowLauncher' }
      - window_class: { regex: '#32770' }

binding_modes:
  - name: 'resize'

keybindings:
  - commands: ['focus --direction left']
    bindings: ['alt+h', 'alt+left']
  - commands: ['focus --direction right']
    bindings: ['alt+l', 'alt+right']
  - commands: ['focus --direction up']
    bindings: ['alt+k', 'alt+up']
  - commands: ['focus --direction down']
    bindings: ['alt+j', 'alt+down']
  - commands: ['move --direction left']
    bindings: ['alt+shift+h', 'alt+shift+left']
  - commands: ['move --direction right']
    bindings: ['alt+shift+l', 'alt+shift+right']
  - commands: ['resize --width +2%']
    bindings: ['alt+u']
  - commands: ['resize --width -2%']
    bindings: ['alt+p']
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['alt+r']
  - commands: ['wm-disable-binding-mode --name resize']
    bindings: ['escape', 'alt+r']
  - commands: ['wm-toggle-pause']
    bindings: ['alt+shift+p']
  - commands: ['toggle-floating --centered']
    bindings: ['alt+shift+space']
  - commands: ['toggle-fullscreen']
    bindings: ['alt+f']
  - commands: ['close']
    bindings: ['alt+shift+q']
  - commands: ['wm-exit']
    bindings: ['alt+shift+e']
  - commands: ['wm-reload-config']
    bindings: ['alt+shift+r']
  - commands: ['shell-exec wt']
    bindings: ['alt+enter']

  # Mode switcher hotkeys (Alt+Shift+1..4 and Alt+Shift+0)
  - commands: ['shell-exec powershell -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File C:\Scripts\Switch-Mode.ps1 -Mode linux']
    bindings: ['alt+shift+1']
  - commands: ['shell-exec powershell -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File C:\Scripts\Switch-Mode.ps1 -Mode hybrid']
    bindings: ['alt+shift+2']
  - commands: ['shell-exec powershell -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File C:\Scripts\Switch-Mode.ps1 -Mode studio']
    bindings: ['alt+shift+3']
  - commands: ['shell-exec powershell -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File C:\Scripts\Switch-Mode.ps1 -Mode saver']
    bindings: ['alt+shift+4']
  - commands: ['shell-exec powershell -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File C:\Scripts\Switch-Mode.ps1 -Mode reset']
    bindings: ['alt+shift+0']

  # Workspaces
  - commands: ['focus --workspace 1']
    bindings: ['alt+1']
  - commands: ['focus --workspace 2']
    bindings: ['alt+2']
  - commands: ['focus --workspace 3']
    bindings: ['alt+3']
  - commands: ['focus --workspace 4']
    bindings: ['alt+4']
  - commands: ['focus --workspace 5']
    bindings: ['alt+5']
  - commands: ['focus --workspace 6']
    bindings: ['alt+6']
  - commands: ['focus --workspace 7']
    bindings: ['alt+7']
  - commands: ['focus --workspace 8']
    bindings: ['alt+8']
  - commands: ['focus --workspace 9']
    bindings: ['alt+9']
  - commands: ['move --workspace 5', 'focus --workspace 5']
    bindings: ['alt+shift+5']
  - commands: ['move --workspace 6', 'focus --workspace 6']
    bindings: ['alt+shift+6']
  - commands: ['move --workspace 7', 'focus --workspace 7']
    bindings: ['alt+shift+7']
  - commands: ['move --workspace 8', 'focus --workspace 8']
    bindings: ['alt+shift+8']
  - commands: ['move --workspace 9', 'focus --workspace 9']
    bindings: ['alt+shift+9']
